# Reverse proxy: one origin for the app, /api → backend, everything else → frontend.
# TLS terminates here in production (certs mounted; HSTS already set by the API).

events {}

http {
  upstream backend  { server backend:4000; }
  upstream frontend { server frontend:3000; }

  # basic edge rate limit (defense in depth; the app rate-limits per user/IP too)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend;
    }

    location = /health { proxy_pass http://backend; }
    location = /metrics { proxy_pass http://backend; }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://frontend;
    }
  }
}

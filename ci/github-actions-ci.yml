name: CI

on:
  push:
    branches: [main, Backend]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Frontend typecheck
        run: npm ci && npx tsc --noEmit
      - name: Backend typecheck
        working-directory: backend
        run: npm ci && npm run typecheck

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Backend tests (unit + integration)
        working-directory: backend
        run: npm ci && npm test

  build:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Next.js build
        run: npm ci && npx next build
      - name: Docker image
        run: docker build -t myhouse-backend:${{ github.sha }} backend

  e2e:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true # UI specs are advisory until the frontend is wired to the backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright UI tests
        run: npx playwright test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Backend'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging (stub — replace with Fly/Railway/ECS)
        run: echo "deploy myhouse-backend:${{ github.sha }} → staging"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Smoke test against staging
        working-directory: backend
        run: npm ci && npm run smoke

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production # configure required reviewers in repo settings → approval gate
    steps:
      - name: Deploy to production (stub)
        run: echo "deploy myhouse-backend:${{ github.sha }} → production"

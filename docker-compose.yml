# Local production-like stack. `docker compose up` brings the whole system online.
# postgres/redis are provisioned now so the app can flip off its dev fallbacks
# by setting DATABASE_URL / REDIS_URL — no code change required.

services:
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-32-char-min-secret}
      CORS_ORIGINS: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_FALLBACK_PROVIDER: mock
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://myhouse:myhouse@postgres:5432/myhouse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myhouse
      POSTGRES_PASSWORD: myhouse
      POSTGRES_DB: myhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025" # web UI for captured emails (verification / reset)

volumes:
  pgdata:
